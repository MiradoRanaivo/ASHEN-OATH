<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss — Validation visuelle</title>
<style>
body{margin:0;background:#17151d;color:#eee;font-family:system-ui,sans-serif}main{max-width:1180px;margin:24px auto;padding:0 16px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}label{display:grid;gap:6px;font-size:13px}select,input{background:#211e29;color:#fff;border:1px solid #51485d;padding:8px}#stage{height:420px;border:1px solid #51485d;display:grid;place-items:center}.checker{background-color:#202020;background-image:linear-gradient(45deg,#303030 25%,transparent 25%),linear-gradient(-45deg,#303030 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#303030 75%),linear-gradient(-45deg,transparent 75%,#303030 75%);background-size:32px 32px}.white{background:#fff}.black{background:#000}canvas{image-rendering:pixelated}#rows{display:grid;gap:18px}.row{border:1px solid #51485d;padding:10px}.row h3{margin:0 0 8px;font-size:14px}.frames{display:grid;grid-template-columns:repeat(12,minmax(70px,1fr));gap:6px}.frame{text-align:center;border:1px solid #35303d;padding:4px;min-height:105px}.frame img{width:128px;height:128px;max-width:100%;object-fit:contain;image-rendering:pixelated}.frame small{display:block;font-size:10px;color:#bbb;word-break:break-word}
</style>
</head>
<body><main><h1>Roi Squelette Déchu — validation visuelle</h1>
<div class="controls"><label>Rangée<select id="row"></select></label><label>Fond<select id="background"><option value="checker">Damier</option><option value="white">Blanc</option><option value="black">Noir</option></select></label><label>Vitesse<input id="speed" type="range" min="1" max="24" value="8"></label><button id="pause">Pause</button></div>
<div id="stage" class="checker"><canvas id="canvas" width="512" height="512"></canvas></div><div id="info"></div><h2>Les 96 frames</h2><div id="rows"></div></main>
<script>
(async()=>{const audit=await fetch('./validation/frame_audit.json').then(r=>r.json());const cls=await fetch('./validation/row_classification.json').then(r=>r.json());const row=document.querySelector('#row'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),pause=document.querySelector('#pause'),speed=document.querySelector('#speed');ctx.imageSmoothingEnabled=false;let currentRow=1,currentFrame=1,image=null,paused=false,last=0;
for(let r=1;r<=8;r++){const o=document.createElement('option');o.value=r;o.textContent=`Rangée ${r} — ${cls['row'+r].status}`;row.append(o)}row.onchange=()=>{currentRow=Number(row.value);currentFrame=1;loadImage()};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Reprendre':'Pause'};document.querySelector('#background').onchange=e=>{stage.className=e.target.value};
function loadImage(){const f=audit.frames.find(x=>x.row===currentRow&&x.column===currentFrame);image=new Image();image.onload=()=>document.querySelector('#info').textContent=`${f.file} · ${f.width}×${f.height} · ${f.visiblePixels} pixels visibles · ${f.status}`;image.src='./'+f.file}
function draw(t){if(!paused&&image?.complete){const ms=1000/Number(speed.value);if(t-last>=ms){currentFrame=currentFrame===12?1:currentFrame+1;loadImage();last=t}}if(image?.complete){ctx.clearRect(0,0,512,512);ctx.drawImage(image,192,192,128,128)}requestAnimationFrame(draw)}
for(let r=1;r<=8;r++){const c=cls['row'+r],section=document.createElement('section');section.className='row';section.innerHTML=`<h3>Rangée ${r} — ${c.status}: ${c.name}</h3>`;const grid=document.createElement('div');grid.className='frames';audit.frames.filter(f=>f.row===r).forEach(f=>{const card=document.createElement('div');card.className='frame checker';card.innerHTML=`<img src="./${f.file}" alt="${f.file}"><small>${f.file}<br>${f.width}×${f.height}<br>${f.status}</small>`;grid.append(card)});section.append(grid);document.querySelector('#rows').append(section)}loadImage();requestAnimationFrame(draw)})();
</script></body></html>
